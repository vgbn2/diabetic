<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Quant HUD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <div class="hud-header">
        <div><span class="status-dot"></span> BIO-QUANT</div>
        <div id="last-update">LIVE</div>
    </div>

    <div class="hud-container">
        <!-- Core Gauge -->
        <div class="glass-card gauge-section">
            <h1 class="glucose-value g-in" id="glucose-val">--.-</h1>
            <span class="unit-label">mmol/L</span>
            <div class="velocity-badge" id="velocity-val">↑ +0.0/min</div>
        </div>

        <!-- Meta Stats -->
        <div class="stats-grid">
            <div class="glass-card stat-item">
                <span class="stat-label">Active Carbs</span>
                <span class="stat-value" id="carbs-val">0g</span>
            </div>
            <div class="glass-card stat-item">
                <span class="stat-label">Insulin (IOB)</span>
                <span class="stat-value" id="insulin-val">0.00U</span>
            </div>
        </div>

        <!-- Predictive Horizon -->
        <div class="glass-card chart-container">
            <div class="chart-head">
                <span class="stat-label" id="horizon-label">Metabolic Horizon (4h)</span>
                <div class="seg">
                    <button class="seg-btn active" id="btn-4h" onclick="setHorizon('4h')">4h</button>
                    <button class="seg-btn" id="btn-1d" onclick="setHorizon('1d')">1d</button>
                </div>
            </div>
            <canvas id="horizonChart"></canvas>
        </div>
    </div>

    <nav class="nav">
        <a href="/" class="active">Dashboard</a>
        <a href="/history">History</a>
        <a href="/settings">Settings</a>
    </nav>

    <script src="/assets/auth.js"></script>
    <script src="/assets/api.js"></script>
    <script src="/assets/dashboard.js"></script>
</body>
</html>
